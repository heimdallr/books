<svg xmlns="http://w3.org" viewBox="0 0 64 64" width="64" height="64">
  <g fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Линия связи 1: от первого корня ко второму уровню -->
    <path d="M9.5 22v10h10" />
    
    <!-- Линия связи 2: от второго уровня к третьему (дочернему к второму) -->
    <path d="M25.5 40v10h10" />
    
    <!-- Корневой элемент (Верхняя строка) -->
    <circle cx="9.5" cy="14" r="3" fill="#ffffff" />
    <path d="M26 14h34" />
    
    <!-- Подгруппа 1 (Средняя строка, сдвиг 1-го уровня) -->
    <circle cx="25.5" cy="32" r="3" fill="#ffffff" />
    <path d="M42 32h18" />
    
    <!-- Подгруппа 2 (Нижняя строка, сдвиг 2-го уровня — дочерняя к средней) -->
    <circle cx="41.5" cy="50" r="3" fill="#ffffff" />
    <path d="M58 50h2" />
  </g>
</svg>
